name: Relay check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check relay sync
        run: node Cursor++/scripts/sync-relay.mjs --check

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Cursor++/pnpm-lock.yaml

      - name: Install
        working-directory: Cursor++
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: Cursor++
        run: pnpm run check-types
