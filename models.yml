# Command Code GOAT plan ($10/mo) — all 36 included models
# Endpoint: OpenAI-compatible https://api.commandcode.ai/provider/v1/chat/completions
#
# API key: set env var COMMANDCODE_API_KEY, OR replace below with the literal key
# (apiKey is treated as an env var name first; if unset, the literal string is used).
# Create the key at https://commandcode.ai/studio/ -> API Keys. Same key works for CLI and API.
#
# input / contextWindow / maxTokens per model from official provider docs
# (Z.AI, Qwen, DeepSeek, OpenAI, Google, Meta, MiniMax, Moonshot, xAI, NVIDIA,
#  Poolside, StepFun, Tencent, Thinking Machines, Xiaomi).
# Muse Spark 1.2 family also accepts video/audio/PDF upstream — add those values
# to `input` only if your omp schema accepts them.
#
# Switch models in omp via /models. Example selector: commandcode/zai-org/GLM-5.2

providers:
  commandcode:
    models:
      # Z AI GLM
      - id: z-ai/glm-5.3-flash
        name: GLM-5.3 Flash
        input: [text, image]
        contextWindow: 1048576
        maxTokens: 131072
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, max]
          defaultLevel: max
      - id: zai-org/GLM-5.3
        name: GLM-5.3
        input: [text]
        contextWindow: 1000000
        maxTokens: 131072
        supportsReasoning: true
